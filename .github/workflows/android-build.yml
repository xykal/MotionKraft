name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      buildType:
        description: Build type
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.buildType == 'debug'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-write-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build Debug
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error

  build-release:
    name: Build Signed Release APK/AAB
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.buildType == 'release')
    environment: production
    outputs:
      version_name: ${{ steps.version.outputs.versionName }}
      version_code: ${{ steps.version.outputs.versionCode }}
    steps:
      - name: Verify actor
        uses: actions/github-script@v7
        with:
          script: |
            if (context.actor !== 'xykal') {
              core.setFailed('Unauthorized actor: ' + context.actor);
            }

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/motionkraft-release.jks
          keytool -list -keystore keystore/motionkraft-release.jks \
            -storepass "${{ secrets.SIGNING_STORE_PASSWORD }}" \
            -storetype PKCS12 || exit 1
          echo "Keystore verified"

      - name: Compute version
        id: version
        run: |
          REF="${GITHUB_REF}"
          if [[ "$REF" == refs/tags/v* ]]; then
            TAG_NAME=${REF#refs/tags/v}
            echo "versionName=$TAG_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "versionName=1.0.0" >> "$GITHUB_OUTPUT"
          fi
          BUILD_NUM=$(( ${{ github.run_number }} + 1000 ))
          echo "versionCode=$BUILD_NUM" >> "$GITHUB_OUTPUT"

      - name: Build Release APK + AAB
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          BUILD_NUMBER: ${{ steps.version.outputs.versionCode }}
          VERSION_NAME: ${{ steps.version.outputs.versionName }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Checksums
        run: |
          cd app/build/outputs
          : > apk/release/sha256sums.txt
          sha256sum apk/release/*.apk >> apk/release/sha256sums.txt
          sha256sum bundle/release/*.aab >> apk/release/sha256sums.txt
          cat apk/release/sha256sums.txt

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.versionName }}-b${{ steps.version.outputs.versionCode }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/sha256sums.txt
            app/build/outputs/bundle/release/*.aab
          retention-days: 90
          if-no-files-found: error

  publish-release:
    name: Draft GitHub Release
    runs-on: ubuntu-latest
    needs: build-release
    if: always() && needs.build-release.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.build-release.outputs.version_name }}-b${{ needs.build-release.outputs.version_code }}
          path: release-artifacts

      - name: Build release notes
        run: |
          {
            echo "## MotionKraft v${{ needs.build-release.outputs.version_name }} (build ${{ needs.build-release.outputs.version_code }})"
            echo ""
            echo "APK variants (pick one for your device):"
            echo ""
            echo "| File | Architecture | Size |"
            echo "|------|-------------|------|"
            for f in release-artifacts/*.apk; do
              name=$(basename "$f")
              case "$name" in
                *arm64-v8a*) arch="arm64-v8a (modern 64-bit phones, recommended)" ;;
                *armeabi-v7a*) arch="armeabi-v7a (older 32-bit phones)" ;;
                *universal*) arch="Universal (all archs, larger)" ;;
                *) arch="release" ;;
              esac
              size=$(du -h "$f" | cut -f1)
              echo "| \`$name\` | $arch | $size |"
            done
            echo ""
            for f in release-artifacts/*.aab; do
              [ -f "$f" ] && echo "- $(basename "$f") (App Bundle for Play Store)"
            done
            echo ""
            echo "SHA256 checksums:"
            echo '```'
            cat release-artifacts/sha256sums.txt 2>/dev/null || true
            echo '```'
            echo ""
            echo "Minimum Android: 7.0 (API 24)"
            echo "Signed with official MotionKraft release key."
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create Draft Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.build-release.outputs.version_name }}-b${{ needs.build-release.outputs.version_code }}
          name: MotionKraft v${{ needs.build-release.outputs.version_name }} (b${{ needs.build-release.outputs.version_code }})
          draft: true
          prerelease: false
          body_path: RELEASE_NOTES.md
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@v3.88.0
        with:
          path: ./
          base: HEAD~1
          head: HEAD
          extra_args: --only-verified
