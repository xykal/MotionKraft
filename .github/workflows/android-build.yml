name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      buildType:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
        - debug
        - release

# WAJIB: workflow dari fork PR TIDAK dapat akses secrets
permissions:
  contents: write
  pull-requests: write
  actions: read
  id-token: none

# Batasi hanya untuk repo ini, tidak bisa di-reschedule dari event eksternal
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job ini selalu jalan (debug) - TIDAK mengakses secret apapun
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.buildType == 'debug')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate actor permission
        uses: actions/github-script@v7
        with:
          script: |
            // Untuk PR dari fork, tolak jika bukan dari trusted actor
            const allowed = ['xykal'];
            const actor = context.actor;
            if (context.eventName === 'pull_request' && context.payload.pull_request.head.repo.fork) {
              if (!allowed.includes(actor)) {
                // Tetap build tapi tanpa akses secret, ini hanya untuk verifikasi
                core.info(`External PR from ${actor} — building debug only, no release signing`);
              }
            }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-write-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build Debug
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error

  # Job release: MEMERLUKAN environment "production" dengan protection rule
  # Protection rule HARUS dikonfigurasi di Settings > Environments > production:
  #   - Required reviewers: xykal
  #   - Wait timer: 0
  #   - Deployment branches: main, tags/v*
  build-release:
    name: Build Signed Release APK/AAB
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.buildType == 'release')
    environment: production
    steps:
      - name: Verify actor
        uses: actions/github-script@v7
        with:
          script: |
            // Double check: hanya repo owner yang bisa trigger
            if (context.actor !== 'xykal') {
              core.setFailed(`Unauthorized actor: ${context.actor}. Only xykal can trigger release builds.`);
            }

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/motionkraft-release.jks
          # Verify keystore valid
          keytool -list -keystore keystore/motionkraft-release.jks -storepass "${{ secrets.SIGNING_STORE_PASSWORD }}" -storetype PKCS12 || exit 1
          echo "Keystore decoded and verified"

      - name: Compute version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/v}
            echo "versionName=$TAG_NAME" >> $GITHUB_OUTPUT
          else
            echo "versionName=1.0.0" >> $GITHUB_OUTPUT
          fi
          BUILD_NUM=$(( ${{ github.run_number }} + 1000 ))
          echo "versionCode=$BUILD_NUM" >> $GITHUB_OUTPUT
          echo "Version: $TAG_NAME / $BUILD_NUM"

      - name: Build Release APK + AAB
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          BUILD_NUMBER: ${{ steps.version.outputs.versionCode }}
          VERSION_NAME: ${{ steps.version.outputs.versionName }}
        run: |
          ./gradlew assembleRelease bundleRelease

      - name: Sign artifact SHA256
        run: |
          cd app/build/outputs/apk/release
          sha256sum *.apk > sha256sums.txt
          cd ../bundle/release
          sha256sum *.aab >> ../../../apk/release/sha256sums.txt
          cat ../../../apk/release/sha256sums.txt

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.versionName }}-build${{ steps.version.outputs.versionCode }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/sha256sums.txt
            app/build/outputs/bundle/release/*.aab
          retention-days: 90
          if-no-files-found: error
          compression-level: 6

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          name: MotionKraft v${{ steps.version.outputs.versionName }}
          draft: true
          prerelease: false
          generate_release_notes: true
          body: |
            ## MotionKraft v${{ steps.version.outputs.versionName }}

            **Install**
            1. Download `app-release.apk`
            2. Allow installation from unknown sources when prompted
            3. Verify the SHA256 checksum matches `sha256sums.txt`

            Minimum Android: 7.0 (API 24)
            Architectures: arm64-v8a, armeabi-v7a
            Signed with official MotionKraft release key
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/sha256sums.txt
            app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-scan:
    name: Dependency & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for leaked secrets in repo
        uses: trufflesecurity/trufflehog@v3.88.0
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
